# DKMS packaging for the PATCHED ASIX AX88179B driver.
# Two local changes vs the vendor v4.1.0 tarball (both required — see README.md):
#   1. ax_config.h : ENABLE_INT_POLLING 0 -> 1   (compile in the MII-BMSR polling path)
#   2. ax_main.c   : force int_polling_enable = true (the unit has an interrupt EP feeding
#                    a bogus link bit, so the vendor's auto-fallback never triggered)
# Version is tagged "-patched1" so `dkms status` never looks like stock vendor source.

PACKAGE_NAME="asix-ax88179"
PACKAGE_VERSION="4.1.0-patched1"

BUILT_MODULE_NAME[0]="ax_usb_nic"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/usb"

# Drive kbuild directly rather than the tarball's `all:` target — `all:` also compiles the
# vendor userspace tools with -Werror, which has no business failing a kernel-module rebuild.
# (No CLEAN= — deprecated in current DKMS; it warns three times per rebuild.)
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

AUTOINSTALL="yes"
